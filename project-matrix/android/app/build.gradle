plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.lodestar.matrix'
    compileSdk 34
    defaultConfig {
        applicationId 'com.lodestar.matrix'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.2.0-app1'
    }
    signingConfigs {
        // A fixed key so a newer APK installs over an older one. Sideload-only; see README.
        release { storeFile file('../matrix-app.keystore'); storePassword 'lodestar'; keyAlias 'matrix'; keyPassword 'lodestar' }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.github.mik3y:usb-serial-for-android:3.8.0'
}
