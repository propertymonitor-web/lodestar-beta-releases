name: Build Matrix+MNA Android app

# Wraps project-matrix/dashboard/matrix.html in an Android app that talks to the radio over USB serial
# (so Chrome's Web Serial is not needed). The signed APK is committed to matrix-android/.
# Engineered by: Aries Thorne & Todd Steinhauer for Wolf Reactive Systems (WRS)
on:
  workflow_dispatch:
  push:
    paths: ["project-matrix/android/**", "project-matrix/dashboard/matrix.html", ".github/workflows/build-matrix-app.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Bundle the dashboard
        run: cp project-matrix/dashboard/matrix.html project-matrix/android/app/src/main/assets/matrix.html
      - name: Build
        working-directory: project-matrix/android
        run: gradle --no-daemon assembleRelease
      - name: Collect
        run: |
          mkdir -p matrix-android
          cp project-matrix/android/app/build/outputs/apk/release/app-release.apk matrix-android/Matrix-MNA-dashboard.apk
          sha256sum matrix-android/Matrix-MNA-dashboard.apk | tee matrix-android/Matrix-MNA-dashboard.apk.sha256
      - uses: actions/upload-artifact@v4
        with: { name: Matrix-MNA-dashboard-apk, path: matrix-android/Matrix-MNA-dashboard.apk }
      - name: Commit APK
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add matrix-android
          git diff --cached --quiet || git commit -m "Matrix+MNA Android app build" 
          git push
