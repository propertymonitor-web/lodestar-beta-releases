name: Build stock MeshCore USB companion (radio for a Waypost BBS)

run-name: "Waypost radio ${{ inputs.board }}"

# The radio that sits next to the Waypost BBS computer needs the MeshCore companion firmware that talks over a USB cable.
# This builds the stock MeshCore firmware, unmodified, at a pinned commit. The result is a workflow artifact, not a public release.
on:
  workflow_dispatch:
    inputs:
      env:
        description: "PlatformIO environment (the radio and the USB companion build)"
        type: string
        default: heltec_v4_companion_radio_usb
      board:
        description: "Short name of the radio, used in file names (e.g. heltec-v4, heltec-v3)"
        type: string
        default: heltec_v4
      meshcore_ref:
        description: "MeshCore commit to build"
        type: string
        default: 81dbae592ffad40b4212bc0b37e82b38da08f4bc

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PIO_ENV: ${{ inputs.env }}
      BOARD: ${{ inputs.board }}
      MC_REF: ${{ inputs.meshcore_ref }}
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Get MeshCore
        run: |
          git init mc
          cd mc
          git remote add origin https://github.com/meshcore-dev/MeshCore.git
          git fetch --depth 1 origin "$MC_REF"
          git checkout FETCH_HEAD
      - name: Build
        run: |
          set -o pipefail
          pip install platformio
          cd mc
          pio run -e "$PIO_ENV" -t mergebin 2>&1 | tee ../build.log
      - name: Show compile errors
        if: ${{ failure() }}
        run: |
          { grep -E "error|overflow|will not fit|region|FAILED|undefined reference|No such file" build.log; tail -n 12 build.log; } | head -40 | while IFS= read -r l; do
            echo "::error::${l:0:900}"
          done
      - name: Collect output
        run: |
          mkdir -p out
          B=mc/.pio/build/"$PIO_ENV"
          cp $B/firmware-merged.bin "out/waypost-radio-$BOARD-usb-merged.bin"
          cp $B/firmware.bin "out/waypost-radio-$BOARD-usb-update.bin"
          cp mc/license.txt out/MESHCORE-LICENSE.txt
          git -C mc rev-parse HEAD > out/meshcore_commit.txt
          echo "$PIO_ENV" > out/pio_env.txt
          sha256sum out/*.bin > out/SHA256SUMS.txt
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: waypost-radio-${{ env.BOARD }}
          path: out/
